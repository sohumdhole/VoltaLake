# Databricks Apps Deployment Configuration
# App: VoltaLake Customer Energy Intelligence
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8501"
  - --server.address
  - "0.0.0.0"

env:
  - name: DATABRICKS_APP_NAME
    value: "voltalake-customer-intelligence"
  - name: VOLTALAKE_CATALOG
    value: "voltalake"
  - name: VOLTALAKE_SCHEMA
    value: "gold"
